{% extends 'base.html' %}{% block content %}<h1>{{ project.project_name }} · Members</h1><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Employee<select name="user_id">{% for u in users %}<option value="{{ u.id }}">{{ u.name }} ({{ u.employee_id }})</option>{% endfor %}</select></label><label>Access level<select name="access_level"><option>read</option><option>write</option><option>manage</option></select></label><button class="primary">Assign / Update</button></form><div class="panel"><h2>Assigned employees</h2>{% for m,u in memberships %}<div class="item"><span>{{ u.name }} — {{ m.access_level }}</span><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="user_id" value="{{ u.id }}"><input type="hidden" name="action" value="remove"><button class="danger">Remove</button></form></div>{% endfor %}</div>{% endblock %}
