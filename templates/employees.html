{% extends 'base.html' %}{% block content %}<div class="heading"><div><div class="eyebrow">PEOPLE</div><h1>Employees</h1></div><a class="button primary" href="{{ url_for('admin.employee_form') }}">+ Add employee</a></div><div class="panel table-wrap"><table><tr><th>ID</th><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>{% for u in users %}<tr><td>{{ u.employee_id }}</td><td>{{ u.name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td><td><span class="pill">{{ u.status }}</span></td><td><a href="{{ url_for('admin.employee_form',id=u.id) }}">Edit</a></td></tr>{% endfor %}</table></div>{% endblock %}
