{% extends 'base.html' %}{% block content %}<h1>{{ 'Edit' if user else 'Create' }} employee</h1><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Employee ID<input name="employee_id" value="{{ user.employee_id if user else '' }}" {% if user %}readonly{% endif %} required></label>{% for k in ['name','username','email','department'] %}<label>{{ k|title }}<input name="{{ k }}" value="{{ user|attr(k) if user else '' }}" required></label>{% endfor %}<label>Password {{ '(leave blank to keep)' if user else '' }}<input type="password" name="password" {% if not user %}required{% endif %}></label><label>Role<select name="role">{% for r in ['Admin','Project Manager','Senior Employee','Junior Employee','New Employee'] %}<option {% if user and user.role==r %}selected{% endif %}>{{ r }}</option>{% endfor %}</select></label><label>Status<select name="status">{% for s in ['active','inactive'] %}<option {% if user and user.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><button class="primary">Save employee</button></form>{% endblock %}
