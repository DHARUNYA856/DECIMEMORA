{% extends 'base.html' %}{% block content %}<h1>{{ 'Edit' if project else 'Create' }} project</h1><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Project code<input name="project_code" value="{{ project.project_code if project else '' }}" {% if project %}readonly{% endif %} required></label><label>Project name<input name="project_name" value="{{ project.project_name if project else '' }}" required></label><label>Description<textarea name="description">{{ project.description if project else '' }}</textarea></label><label>Department<input name="department" value="{{ project.department if project else 'Engineering' }}" required></label><label>Status<select name="status">{% for s in ['active','inactive'] %}<option {% if project and project.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><button class="primary">Save project</button></form>{% endblock %}
