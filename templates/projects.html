{% extends 'base.html' %}{% block content %}<div class="heading"><div><div class="eyebrow">PORTFOLIO</div><h1>Projects</h1></div><a class="button primary" href="{{ url_for('admin.project_form') }}">+ New project</a></div><div class="panel table-wrap"><table><tr><th>Code</th><th>Project</th><th>Department</th><th>Status</th><th>Actions</th></tr>{% for p in projects %}<tr><td>{{ p.project_code }}</td><td>{{ p.project_name }}</td><td>{{ p.department }}</td><td>{{ p.status }}</td><td><a href="{{ url_for('admin.project_form',id=p.id) }}">Edit</a> · <a href="{{ url_for('admin.members',id=p.id) }}">Members</a></td></tr>{% endfor %}</table></div>{% endblock %}
