{% extends 'base.html' %}{% block content %}<h1>{{ 'Edit' if decision else 'Capture' }} decision</h1><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Project<select name="project_id">{% for p in projects %}<option value="{{ p.id }}" {% if decision and decision.project_id==p.id %}selected{% endif %}>{{ p.project_name }}</option>{% endfor %}</select></label>{% for k in ['problem','context','options','decision','reason','action_taken','outcome'] %}<label>{{ k|replace('_',' ')|title }}<textarea name="{{ k }}" {% if k in ['problem','decision'] %}required{% endif %}>{{ decision|attr(k) if decision else '' }}</textarea></label>{% endfor %}<label>Status<select name="status">{% for s in ['open','investigating','Resolved','archived'] %}<option {% if decision and decision.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><button class="primary">Save & index decision</button></form>{% endblock %}
